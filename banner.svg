<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Vo Nguyen Minh Long</title>
  <desc id="d">A CCTV frame split into a 6 by 3 grid of tiles. A scan moves across the tiles, stops on one, and draws a detection box around a small figure far down the road.</desc>
  <style>
    .osd{font:500 14px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#aab4bf;letter-spacing:.5px}
    .name{font:700 54px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#f2f4f7}
    .sub{font:400 22px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#a3adb8}
    .tag{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#1a1300}
    .scan{transform:translate(800px,133.33px);animation:scan 2.4s step-end both}
    @keyframes scan{
      0%{transform:translate(800px,0px)}
      25%{transform:translate(1000px,0px)}
      50%{transform:translate(1000px,133.33px)}
      75%,100%{transform:translate(800px,133.33px)}
    }
    .det{opacity:0;animation:show .35s ease-out 1.9s forwards}
    @keyframes show{to{opacity:1}}
    .rec{animation:blink 1.4s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .scan,.det,.rec{animation:none}
      .det{opacity:1}
    }
  </style>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="14"/></clipPath>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#11161d" stop-opacity=".97"/>
      <stop offset=".45" stop-color="#11161d" stop-opacity=".88"/>
      <stop offset=".66" stop-color="#11161d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#121821"/>
      <stop offset="1" stop-color="#1a222d"/>
    </linearGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity=".035"/>
    </pattern>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".78">
      <stop offset=".62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#frame)">
    <!-- scene -->
    <rect width="1200" height="232" fill="url(#sky)"/>
    <rect y="232" width="1200" height="168" fill="#171e27"/>
    <g fill="#1d2632">
      <rect x="610" y="158" width="74" height="74"/>
      <rect x="692" y="122" width="96" height="110"/>
      <rect x="1004" y="146" width="58" height="86"/>
      <rect x="1070" y="96" width="130" height="136"/>
    </g>
    <g fill="#2a3646">
      <rect x="706" y="136" width="8" height="10"/><rect x="726" y="136" width="8" height="10"/><rect x="746" y="136" width="8" height="10"/>
      <rect x="706" y="160" width="8" height="10"/><rect x="746" y="184" width="8" height="10"/>
      <rect x="1086" y="112" width="10" height="12"/><rect x="1110" y="112" width="10" height="12"/><rect x="1134" y="136" width="10" height="12"/>
      <rect x="1086" y="160" width="10" height="12"/><rect x="1158" y="112" width="10" height="12"/>
    </g>
    <polygon points="480,400 1200,400 1200,350 902,232 884,232" fill="#1b232e"/>
    <line x1="893" y1="234" x2="840" y2="400" stroke="#334152" stroke-width="2" stroke-dasharray="10 14"/>

    <!-- the small thing -->
    <g fill="#d6dde5">
      <circle cx="920" cy="226" r="3.2"/>
      <rect x="916.8" y="229.8" width="6.4" height="11" rx="2"/>
      <rect x="917.2" y="240" width="2.2" height="6"/>
      <rect x="920.6" y="240" width="2.2" height="6"/>
    </g>

    <!-- tile grid -->
    <g stroke="#3a4759" stroke-width="1" stroke-dasharray="3 5">
      <line x1="200" y1="0" x2="200" y2="400"/>
      <line x1="400" y1="0" x2="400" y2="400"/>
      <line x1="600" y1="0" x2="600" y2="400"/>
      <line x1="800" y1="0" x2="800" y2="400"/>
      <line x1="1000" y1="0" x2="1000" y2="400"/>
      <line x1="0" y1="133.33" x2="1200" y2="133.33"/>
      <line x1="0" y1="266.67" x2="1200" y2="266.67"/>
    </g>

    <rect width="1200" height="400" fill="url(#fade)"/>

    <!-- scan, then detection -->
    <rect class="scan" x="0" y="0" width="200" height="133.33" fill="#ffb000" fill-opacity=".06" stroke="#ffb000" stroke-opacity=".9" stroke-width="2"/>
    <g class="det">
      <rect x="909" y="218" width="22" height="30" fill="none" stroke="#ffb000" stroke-width="1.6"/>
      <rect x="909" y="202" width="80" height="16" fill="#ffb000"/>
      <text class="tag" x="913" y="214">person 0.97</text>
    </g>

    <!-- copy -->
    <text class="name" x="48" y="170">Vo Nguyen Minh Long</text>
    <text class="sub" x="50" y="212">AI student at UIT, Ho Chi Minh City.</text>
    <text class="sub" x="50" y="244">I build search systems that find the small things.</text>

    <!-- on-screen display -->
    <text class="osd" x="24" y="36" xml:space="preserve">CAM 07  UIT</text>
    <circle class="rec" cx="1112" cy="31" r="5" fill="#ff3b30"/>
    <text class="osd" x="1176" y="36" text-anchor="end">REC</text>
    <text class="osd" x="24" y="380" xml:space="preserve">TILES 6x3  QUERY "small things"</text>

    <rect width="1200" height="400" fill="url(#lines)"/>
    <rect width="1200" height="400" fill="url(#vignette)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="14" fill="none" stroke="#2a3340"/>
</svg>
